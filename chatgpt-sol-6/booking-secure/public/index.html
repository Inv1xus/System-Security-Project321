<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Appointment Booking</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="shell header-content">
      <div class="brand"><span class="brand-mark">●</span> Appointment Booking</div>
      <div id="account" class="account" hidden><span id="account-label"></span><button id="logout" class="text-button" type="button">Log out</button></div>
    </div>
  </header>

  <main class="shell">
    <section class="intro">
      <p class="eyebrow">YOUR TIME, RESERVED</p>
      <h1>Find a time that works.</h1>
      <p>Browse open appointments, make a booking, and manage your plans in one place.</p>
    </section>

    <p id="message" class="message" role="status" aria-live="polite" hidden></p>

    <section id="auth-panel" class="card auth-card">
      <div class="section-heading"><div><p class="eyebrow">WELCOME</p><h2>Get started</h2></div></div>
      <div class="tabs" role="tablist" aria-label="Account action">
        <button id="login-tab" class="tab active" type="button" role="tab" aria-selected="true">Log in</button>
        <button id="signup-tab" class="tab" type="button" role="tab" aria-selected="false">Sign up</button>
      </div>
      <form id="auth-form">
        <label>Email <input id="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"></label>
        <label>Password <input id="password" type="password" autocomplete="current-password" required minlength="12" maxlength="256" placeholder="At least 12 characters"></label>
        <button id="auth-submit" class="button primary" type="submit">Log in</button>
      </form>
    </section>

    <div id="app-panel" hidden>
      <section class="card">
        <div class="section-heading"><div><p class="eyebrow">OPEN TIMES</p><h2>Available slots</h2></div><button id="refresh" class="button secondary" type="button">Refresh</button></div>
        <div id="slots" class="list"></div>
      </section>

      <section class="card">
        <div class="section-heading"><div><p class="eyebrow">YOUR PLANS</p><h2>My bookings</h2></div></div>
        <div id="bookings" class="list"></div>
      </section>

      <section id="admin-panel" class="card" hidden>
        <div class="section-heading"><div><p class="eyebrow">ADMIN</p><h2>Manage appointments</h2></div></div>
        <form id="slot-form" class="slot-form">
          <label>Starts <input id="starts-at" type="datetime-local" required></label>
          <label>Ends <input id="ends-at" type="datetime-local" required></label>
          <button class="button primary" type="submit">Add slot</button>
        </form>
        <h3>Upcoming slots</h3>
        <div id="admin-slots" class="list"></div>
        <h3>All bookings</h3>
        <div id="admin-bookings" class="list"></div>
      </section>
    </div>
  </main>
</body>
</html>
