<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – BookIt</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f4f6f8; color: #1a1a2e; }
    header { background: #1a1a2e; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.3rem; }
    header h1 a { color: #fff; text-decoration: none; }
    .user-info { font-size: 0.9rem; color: #ccc; }
    .user-info .role-badge { background: #7c3aed; color: #fff; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.75rem; margin-right: 0.5rem; }
    .user-info button { background: none; border: 1px solid #666; color: #ccc; padding: 0.3rem 0.8rem; border-radius: 4px; cursor: pointer; margin-left: 0.5rem; }
    .user-info button:hover { background: #333; }
    main { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    h2 { margin-bottom: 1rem; font-size: 1.3rem; }
    .section { background: #fff; border-radius: 10px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 2px solid #e2e8f0; color: #555; font-size: 0.8rem; text-transform: uppercase; letter-spacing: .04em; }
    td { padding: 0.55rem 0.6rem; border-bottom: 1px solid #f1f5f9; }
    tr:last-child td { border-bottom: none; }
    .btn-sm { padding: 0.3rem 0.8rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    .btn-del    { background: #ef4444; color: #fff; }
    .btn-del:hover { background: #dc2626; }
    .btn-add    { background: #10b981; color: #fff; padding: 0.5rem 1.2rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.95rem; margin-top: 1rem; }
    .btn-add:hover { background: #059669; }
    .form-row { display: flex; gap: 0.8rem; flex-wrap: wrap; align-items: flex-end; margin-top: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.3rem; }
    .form-group label { font-size: 0.8rem; font-weight: 600; }
    .form-group input { padding: 0.5rem 0.7rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
    .form-group input:focus { outline: none; border-color: #3b82f6; }
    .empty { color: #999; font-style: italic; padding: 0.5rem 0; }
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: #1a1a2e; color: #fff; padding: 0.75rem 1.2rem; border-radius: 8px; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1><a href="index.html">📅 BookIt</a></h1>
    <div class="user-info">
      <span class="role-badge">Admin</span>
      <span id="welcomeMsg"></span>
      <button onclick="logout()">Log out</button>
    </div>
  </header>

  <main>
    <!-- Add Slot -->
    <div class="section">
      <h2>Add Time Slot</h2>
      <form id="addSlotForm">
        <div class="form-row">
          <div class="form-group">
            <label for="slotDate">Date</label>
            <input id="slotDate" type="date" required>
          </div>
          <div class="form-group">
            <label for="startTime">Start time</label>
            <input id="startTime" type="time" required>
          </div>
          <div class="form-group">
            <label for="endTime">End time</label>
            <input id="endTime" type="time" required>
          </div>
          <div class="form-group">
            <label for="capacity">Capacity</label>
            <input id="capacity" type="number" min="1" value="1" style="width:80px">
          </div>
          <button type="submit" class="btn-add">Add Slot</button>
        </div>
      </form>
    </div>

    <!-- All Slots -->
    <div class="section">
      <h2>All Slots</h2>
      <table>
        <thead>
          <tr><th>Date</th><th>Start</th><th>End</th><th>Capacity</th><th>Booked</th><th>Free</th><th>Action</th></tr>
        </thead>
        <tbody id="slotsBody"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>

    <!-- All Bookings -->
    <div class="section">
      <h2>All Bookings</h2>
      <table>
        <thead>
          <tr><th>User</th><th>Email</th><th>Date</th><th>Start</th><th>End</th><th>Booked On</th><th>Action</th></tr>
        </thead>
        <tbody id="bookingsBody"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    async function init() {
      const me = await fetch('/api/auth/me').then(r => r.json());
      if (!me.loggedIn) return location.href = 'login.html';
      if (me.role !== 'admin') return location.href = 'dashboard.html';
      document.getElementById('welcomeMsg').textContent = me.username;
      loadSlots();
      loadBookings();
    }

    async function loadSlots() {
      const slots = await fetch('/api/admin/slots').then(r => r.json());
      const tbody = document.getElementById('slotsBody');
      if (!slots.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty">No slots yet.</td></tr>';
        return;
      }
      tbody.innerHTML = slots.map(s => `
        <tr>
          <td>${formatDate(s.date)}</td>
          <td>${s.start_time}</td>
          <td>${s.end_time}</td>
          <td>${s.capacity}</td>
          <td>${s.booked}</td>
          <td>${s.available}</td>
          <td><button class="btn-sm btn-del" onclick="deleteSlot(${s.id})">Delete</button></td>
        </tr>
      `).join('');
    }

    async function loadBookings() {
      const bookings = await fetch('/api/admin/bookings').then(r => r.json());
      const tbody = document.getElementById('bookingsBody');
      if (!bookings.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty">No bookings yet.</td></tr>';
        return;
      }
      tbody.innerHTML = bookings.map(b => `
        <tr>
          <td>${b.username}</td>
          <td>${b.email}</td>
          <td>${formatDate(b.date)}</td>
          <td>${b.start_time}</td>
          <td>${b.end_time}</td>
          <td>${formatDateTime(b.created_at)}</td>
          <td><button class="btn-sm btn-del" onclick="cancelBooking(${b.booking_id})">Cancel</button></td>
        </tr>
      `).join('');
    }

    document.getElementById('addSlotForm').addEventListener('submit', async e => {
      e.preventDefault();
      const body = {
        date:       document.getElementById('slotDate').value,
        start_time: document.getElementById('startTime').value,
        end_time:   document.getElementById('endTime').value,
        capacity:   parseInt(document.getElementById('capacity').value) || 1,
      };
      const res = await fetch('/api/admin/slots', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (res.ok) {
        showToast('Slot added!');
        e.target.reset();
        loadSlots();
      } else {
        showToast(data.error || 'Failed to add slot', true);
      }
    });

    async function deleteSlot(id) {
      if (!confirm('Delete this slot and all its bookings?')) return;
      const res = await fetch(`/api/admin/slots/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (res.ok) { showToast('Slot deleted.'); loadSlots(); loadBookings(); }
      else showToast(data.error || 'Error', true);
    }

    async function cancelBooking(id) {
      if (!confirm('Cancel this booking?')) return;
      const res = await fetch(`/api/admin/bookings/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (res.ok) { showToast('Booking cancelled.'); loadSlots(); loadBookings(); }
      else showToast(data.error || 'Error', true);
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      location.href = 'login.html';
    }

    function formatDate(d) {
      const [y, m, day] = d.split('-');
      return `${day}/${m}/${y}`;
    }

    function formatDateTime(dt) {
      return dt ? dt.replace('T', ' ').substring(0, 16) : '';
    }

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.background = isError ? '#b91c1c' : '#1a1a2e';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    init();
  </script>
</body>
</html>
